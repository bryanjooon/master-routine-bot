name: Master Schedule Automation

on:
  schedule:
    # Runs daily at 02:30 PM Tashkent time (GMT+5 = 09:30 AM UTC)
    - cron: '30 9 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub web/mobile

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Schedule Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python bot.py
